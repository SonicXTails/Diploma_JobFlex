# Render Blueprint — JobFlex: бесплатный web + Postgres (без Cron в Blueprint).
#
# Почему нет Cron здесь:
# - В Blueprint для type:cron нельзя plan: free; любой cron = платный инстанс → нужны данные карты.
# - Manual sync без карты возможен только если в файле нет платных сервисов.
#
# Импорт вакансий без оплаты Render Cron:
# 1) Dashboard → твой Web → Shell:
#    python manage.py render_prod_smoke
#    (или отдельно fetch_hh + enforce_hh_import_cap, как в «рецепте» ниже)
# 2) Либо внешний бесплатный scheduler (например GitHub Actions по cron) с секретом DATABASE_URL —
#    клонирование репо, pip install -r requirements.txt, manage.py …
#
# Если позже привяжешь карту — создай Cron Job вручную в Dashboard (New → Cron Job) или
# верни блоки services ниже в YAML как отдельный коммит и синкни Blueprint.
# Рецепт jobflex-hh-import:
#   schedule: 0 7 * * *
#   build:  pip install -r requirements.txt
#   start:  python manage.py fetch_hh --pages 1 --per-page 40 && python manage.py enforce_hh_import_cap
#   env: те же, что у web (DATABASE_URL, DJANGO_SECRET_KEY, DEPLOY_ENV=production, DJANGO_DEBUG=false,
#        DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS, SITE_URL, HH_IMPORT_TOTAL_CAP=1000, PYTHON_VERSION=3.11)
# Рецепт jobflex-hh-db-age-purge (раз в неделю):
#   schedule: 30 4 * * 0
#   build:  pip install -r requirements.txt
#   start:  python manage.py purge_hh_imports_by_db_age --batch 800
#   env: как выше + HH_IMPORT_DB_AGE_PURGE_DAYS=7, HH_IMPORT_DB_AGE_PURGE_ENABLED=true
#
# Фаза 5 (опционально, платно — полный паритет с localhost):
# - Key Value (Redis), Worker celery -A config worker, отдельно beat -A config beat,
#   CELERY_BROKER_URL / CELERY_RESULT_BACKEND на web и worker.

databases:
  - name: jobflex-db
    databaseName: jobflex
    user: jobflex
    plan: free

services:
  - type: web
    name: jobflex
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEPLOY_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobflex-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: jobflex-4fh0.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://jobflex-4fh0.onrender.com
      - key: SITE_URL
        value: https://jobflex-4fh0.onrender.com
      - key: HH_IMPORT_TOTAL_CAP
        value: "1000"
      - key: HH_FETCH_PAGES
        value: "1"
      - key: HH_FETCH_PER_PAGE
        value: "40"
