# Render Blueprint — JobFlex: бесплатный web + Postgres (без Cron в Blueprint).
#
# Почему нет Cron здесь:
# - В Blueprint для type:cron нельзя plan: free; любой cron = платный инстанс → нужны данные карты.
# - Manual sync без карты возможен только если в файле нет платных сервисов.
#
# Импорт вакансий без оплаты Render Shell / Cron:
#
# A) Со своего ПК в продовую БД Render (Shell не нужен):
#    В Render: Postgres → Connect → скопировать External Database URL.
#    Web → Environment → скопировать значение DJANGO_SECRET_KEY.
#    PowerShell (пример):
#      $env:DATABASE_URL = '<вставить External Database URL>'
#      $env:DJANGO_SECRET_KEY = '<секрет web>'
#      $env:DEPLOY_ENV = 'production'; $env:DJANGO_DEBUG = 'false'; $env:HH_IMPORT_TOTAL_CAP = '1000'
#      python manage.py render_prod_smoke
#
# B) GitHub Actions (бесплатно): репозиторий → Settings → Secrets and variables → Actions:
#      RENDER_DATABASE_URL = External Database URL (Postgres на Render)
#      RENDER_DJANGO_SECRET_KEY = тот же DJANGO_SECRET_KEY, что у web на Render
#    Файл: .github/workflows/render-hh-import.yml → вкладка Actions → «Render HH import» → Run workflow;
#    либо по расписанию каждый день 07:00 UTC.
#
# C) Опционально на сервере: python manage.py sync_hh_dictionaries — справочники фильтров HH;
#    города в фильтре «регион» — из поля region вакансий (см. импорт / backfill_descriptions).
#
# D) Render Shell (если доступен в твоём плане): та же команда render_prod_smoke в Shell web.
#
# Если позже привяжешь карту — создай Cron Job вручную в Dashboard (New → Cron Job) или
# верни блоки services ниже в YAML как отдельный коммит и синкни Blueprint.
# Рецепт jobflex-hh-import:
#   schedule: 0 7 * * *
#   build:  pip install -r requirements.txt
#   start:  python manage.py fetch_hh --pages 1 --per-page 40 && python manage.py enforce_hh_import_cap
#   env: те же, что у web (DATABASE_URL, DJANGO_SECRET_KEY, DEPLOY_ENV=production, DJANGO_DEBUG=false,
#        DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS, SITE_URL, HH_IMPORT_TOTAL_CAP=1000, PYTHON_VERSION=3.11)
# Рецепт jobflex-hh-db-age-purge (раз в неделю):
#   schedule: 30 4 * * 0
#   build:  pip install -r requirements.txt
#   start:  python manage.py purge_hh_imports_by_db_age --batch 800
#   env: как выше + HH_IMPORT_DB_AGE_PURGE_DAYS=7, HH_IMPORT_DB_AGE_PURGE_ENABLED=true
#
# Фаза 5 (опционально, платно — полный паритет с localhost):
# - Key Value (Redis), Worker celery -A config worker, отдельно beat -A config beat,
#   CELERY_BROKER_URL / CELERY_RESULT_BACKEND на web и worker.

databases:
  - name: jobflex-db
    databaseName: jobflex
    user: jobflex
    plan: free

services:
  - type: web
    name: jobflex
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEPLOY_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobflex-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: jobflex-4fh0.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://jobflex-4fh0.onrender.com
      - key: SITE_URL
        value: https://jobflex-4fh0.onrender.com
      - key: HH_IMPORT_TOTAL_CAP
        value: "1000"
      - key: HH_FETCH_PAGES
        value: "1"
      - key: HH_FETCH_PER_PAGE
        value: "40"
