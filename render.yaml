# Blueprint for https://render.com — после создания сервиса заполни в Dashboard переменные
# DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS, SITE_URL (см. комментарий внизу).
databases:
  - name: jobflex-db
    databaseName: jobflex
    user: jobflex
    plan: free

services:
  - type: web
    name: jobflex
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobflex-db
          property: connectionString
      # Подставь свой поддомен onrender.com, например: jobflex-xxxx.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
