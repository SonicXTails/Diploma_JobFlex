# Render Blueprint: https://render.com/docs/infrastructure-as-code
# Если деплой падает на создании БД: на бесплатном плане у аккаунта только одна Free Postgres —
# удали старую или задай другое имя ресурса в Dashboard.

databases:
  - name: jobflex-db
    databaseName: jobflex
    user: jobflex
    plan: free

services:
  - type: web
    name: jobflex
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobflex-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: jobflex-chistotin.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://jobflex-chistotin.onrender.com
      - key: SITE_URL
        value: https://jobflex-chistotin.onrender.com
